<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akina Downhill — three.js</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏔️</text></svg>">

  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a2330; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 16px; bottom: 16px; padding: 12px 16px;
      background: rgba(10,16,24,.6); border: 1px solid rgba(140,160,190,.25);
      border-radius: 10px; color: #e8edf2; backdrop-filter: blur(6px);
      pointer-events: none; min-width: 240px;
    }
    #hud h1 { font-size: 14px; letter-spacing: .12em; color: #ff6a6a; font-weight: 700; }
    #hud #sector { font-size: 18px; font-weight: 600; margin-top: 2px; }
    #hud #stat { font-size: 13px; color: #9fb0c4; margin-top: 4px; }
    #hud small { display:block; margin-top: 8px; color: #6c7d92; font-size: 11px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./vendor/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <h1>秋名 · AKINA DOWNHILL</h1>
    <div id="sector">—</div>
    <div id="stat">—</div>
    <small>Мышь — вращать/зум · клавиша D — вкл/выкл камеру-преследование</small>
  </div>
  <script type="module" src="./akina.js"></script>
</body>
</html>
